<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Supabase接続テスト</title>
</head>

<body style="font-family:sans-serif;padding:20px;">

  <h3>Supabase接続テスト</h3>

  <div>
    名前:
    <input id="name" value="テストプレイヤー">
    <button onclick="doCreate()">部屋を作る</button>
  </div>

  <div style="margin-top:10px;">
    ルームコード:
    <input id="code">
    <button onclick="doJoin()">部屋に参加</button>
  </div>

  <pre id="log"
    style="background:#eee;padding:10px;margin-top:20px;white-space:pre-wrap;"></pre>


  <script type="module">

    import { createClient }
      from "https://esm.sh/@supabase/supabase-js@2";


    // =========================
    // Supabase設定
    // =========================

    const SUPABASE_URL =
      "https://oylrrjwwopsqxlvuknth.supabase.co";

    const ANON_KEY =
      "sb_publishable_kzJdInyZk2q_xbE6if-4hQ_8zz1L_eH";


    const supabase =
      createClient(SUPABASE_URL, ANON_KEY);


    // =========================
    // ログ表示
    // =========================

    const log = (obj) => {
      document.getElementById("log").textContent =
        JSON.stringify(obj, null, 2);
    };


    // =========================
    // 匿名ログイン
    // =========================

    async function ensureLogin() {

      const {
        data: { session }
      } = await supabase.auth.getSession();

      if (session) {
        return true;
      }

      const { error } =
        await supabase.auth.signInAnonymously();

      if (error) {
        log({
          step: "匿名ログイン失敗",
          error: error.message
        });

        return false;
      }

      return true;
    }


    // =========================
    // 部屋を作る
    // =========================

    window.doCreate = async () => {

      const loggedIn = await ensureLogin();

      if (!loggedIn) return;


      const name =
        document.getElementById("name").value;


      const { data, error } =
        await supabase.functions.invoke(
          "create-game",
          {
            body: {
              name: name,
              difficulty: "normal"
            }
          }
        );


      if (error) {

        log({
          step: "create-gameエラー",
          error: error.message,
          name: error.name
        });

        return;
      }


      log(data);


      if (data?.room_code) {

        document.getElementById("code").value =
          data.room_code;

      }

    };


    // =========================
    // 部屋に参加
    // =========================

    window.doJoin = async () => {

  log({ step: "匿名ログイン開始" });

  const { data: loginData, error: loginError } =
    await supabase.auth.signInAnonymously();

  if (loginError) {
    log({
      step: "匿名ログインエラー",
      error: loginError.message
    });
    return;
  }

  log({
    step: "匿名ログイン成功",
    user_id: loginData.user?.id,
    has_session: !!loginData.session,
    has_access_token: !!loginData.session?.access_token
  });


  // -------------------------
  // ルームコード取得
  // -------------------------

  const roomCode =
    document.getElementById("code").value.trim();

  if (!roomCode) {
    log({
      step: "ルームコードが空です"
    });
    return;
  }


  // -------------------------
  // join-game
  // -------------------------

  log({
    step: "join-game呼び出し開始",
    room_code: roomCode
  });

  const { data, error } =
    await supabase.functions.invoke(
      "join-game",
      {
        body: {
          room_code: roomCode,
          name: document.getElementById("name").value
        }
      }
    );


  if (error) {

    log({
      step: "join-gameエラー",
      error: error.message,
      name: error.name
    });

    return;
  }


  log({
    step: "join-game成功",
    data: data
  });

};
  </script>

</body>

</html>
