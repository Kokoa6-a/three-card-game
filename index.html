<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三山勝負 — 2人用カードゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14151a;
    --bg-panel: #1c1d24;
    --bg-panel-2: #22232b;
    --line: #34353f;
    --ink: #ece9e2;
    --ink-dim: #9a9aa4;
    --black-c: #2a2b31;
    --black-c-line: #55565f;
    --silver-c: #c7ccd3;
    --gold-c: #d7a83c;
    --accent: #b1443f;
    --accent-2: #3f7d6e;
    --radius: 10px;
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 50% -10%, #23242c 0%, #14151a 55%, #0f0f13 100%);
    color: var(--ink);
    font-family: "Noto Sans JP", sans-serif;
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,.serif{ font-family: "Shippori Mincho", serif; }
  #app{
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 80px;
    min-height: 100vh;
  }
  .top-title{
    text-align:center;
    margin: 6px 0 22px;
  }
  .top-title h1{
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: .08em;
    margin: 0 0 4px;
    background: linear-gradient(120deg,#e7e2d4,#d7a83c 55%,#e7e2d4);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .top-title p{
    margin:0;
    color: var(--ink-dim);
    font-size: .82rem;
    letter-spacing:.12em;
  }

  .panel{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 20px;
    margin-bottom: 16px;
  }
  .panel-tight{ padding: 16px 18px; }

  .scoreboard{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    background: var(--bg-panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size:.88rem;
  }
  .scoreboard .who{ text-align:center; flex:1; }
  .scoreboard .who .name{ color:var(--ink-dim); font-size:.74rem; letter-spacing:.06em;}
  .scoreboard .who .pts{ font-family:"Shippori Mincho",serif; font-size:1.5rem; font-weight:800; }
  .scoreboard .mid{ text-align:center; color:var(--ink-dim); font-size:.74rem; min-width:74px;}
  .scoreboard .jokers{ font-size:.76rem; color:var(--ink-dim); margin-top:2px;}

  h2.section-title{
    font-size:1.15rem;
    margin: 0 0 14px;
    font-weight:700;
    letter-spacing:.03em;
  }
  p.lead{ color: var(--ink-dim); font-size:.92rem; margin: -6px 0 16px;}

  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  button{
    font-family:"Noto Sans JP",sans-serif;
    font-size: .92rem;
    padding: 11px 20px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg-panel-2);
    color: var(--ink);
    cursor:pointer;
    transition: background .15s, border-color .15s, transform .05s;
  }
  button:hover{ border-color:#565764; background:#282932; }
  button:active{ transform: scale(.98); }
  button.primary{
    background: linear-gradient(135deg,#c6923f,#9c6f26);
    border-color:#c6923f;
    color:#1a1408;
    font-weight:700;
  }
  button.primary:hover{ filter:brightness(1.08); }
  button.ghost{ background:transparent; }
  button:disabled{ opacity:.35; cursor:not-allowed; }
  button.small{ padding:7px 12px; font-size:.8rem; }
  button.selected{ outline: 2px solid var(--gold-c); }

  input[type=text]{
    font-family:"Noto Sans JP",sans-serif;
    background: var(--bg-panel-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:8px;
    padding:9px 12px;
    font-size:.92rem;
    width:100%;
  }
  label.field-label{ display:block; font-size:.8rem; color:var(--ink-dim); margin: 14px 0 6px; }

  .choice-grid{ display:flex; gap:10px; flex-wrap:wrap; }
  .choice-grid button{ flex:1; min-width:90px; }

  /* Cards */
  .card{
    width: 56px; height: 78px;
    border-radius: 7px;
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    position:relative;
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.08);
    user-select:none;
    flex-shrink:0;
  }
  .card .num{ font-size:1.5rem; line-height:1;}
  .card .lbl{ font-size:.6rem; margin-top:3px; letter-spacing:.05em; opacity:.85;}
  .card.color-black{ background:linear-gradient(160deg,#33343c,#1c1d22); color:#e7e5df; border-color:#55565f;}
  .card.color-silver{ background:linear-gradient(160deg,#e5e9ee,#b7bcc4); color:#20232a;}
  .card.color-gold{ background:linear-gradient(160deg,#eec868,#b5852a); color:#2b1f04;}
  .card.face-down{ background:repeating-linear-gradient(45deg,#2a2b33,#2a2b33 6px,#232329 6px,#232329 12px); color:transparent; border-color:#3c3d47;}
  .card.small{ width:42px; height:58px; }
  .card.small .num{ font-size:1.1rem; }
  .card.small .lbl{ font-size:.52rem; }
  .card.clickable{ cursor:pointer; transition: transform .1s; }
  .card.clickable:hover{ transform: translateY(-4px); }
  .card.picked{ outline:2px solid var(--accent-2); transform: translateY(-6px);}
  .card.six-badge::after{
    content:"⟲"; position:absolute; top:2px; right:3px; font-size:.6rem; opacity:.75;
  }

  .hand-row{ display:flex; gap:10px; flex-wrap:wrap; margin: 10px 0 4px; }
  .field-row{ display:flex; gap:16px; justify-content:center; margin: 6px 0 12px; }
  .field-item{ text-align:center; }
  .field-item .cap{ font-size:.72rem; color:var(--ink-dim); margin-bottom:5px; }

  .pile-cols{ display:flex; gap:10px; margin-top:6px; }
  .pile-col{
    flex:1;
    background: var(--bg-panel-2);
    border:2px solid var(--line);
    border-radius:12px;
    padding:12px 8px 10px;
    min-height: 190px;
    display:flex;
    flex-direction:column;
    transition: border-color .15s, box-shadow .15s;
  }
  .pile-col.c-black{ border-color: var(--black-c-line); }
  .pile-col.c-silver{ border-color: #8b8f98; }
  .pile-col.c-gold{ border-color: #a8802f; }
  .pile-col h4{ margin:0 0 4px; text-align:center; font-size:.82rem; font-weight:700; letter-spacing:.04em;}
  .pile-col .opp-info{ text-align:center; font-size:.68rem; color:var(--ink-dim); min-height:16px; margin-bottom:8px; }
  .pile-col .opp-info .badge{ padding:2px 7px; font-size:.66rem; margin:1px 2px;}
  .pile-col .cards-here{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-content:flex-start; flex:1; min-height:64px;}
  .pile-col.selectable{ cursor:pointer; }
  .pile-col.selectable:hover{ background:#282a34; }
  .pile-col.target-hint{ border-color: var(--accent); box-shadow: 0 0 0 2px rgba(177,68,63,.25) inset; }
  .pile-col .drop-label{ text-align:center; font-size:.72rem; color: var(--accent); margin-top:8px; font-weight:700; opacity:0; height:16px; }
  .pile-col.target-hint .drop-label{ opacity:1; }
  .hand-color-summary{ display:flex; justify-content:center; gap:8px; margin: 4px 0 2px; flex-wrap:wrap; }
  .hand-color-summary .chip{ font-size:.7rem; padding:2px 9px; border-radius:999px; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--ink-dim);}

  .badge{
    display:inline-block;
    font-size:.72rem;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bg-panel-2);
    border:1px solid var(--line);
    color: var(--ink-dim);
    margin: 2px 4px 2px 0;
  }
  .badge.gold{ border-color:#a0782a; color:#e9c473; }

  .cover{
    text-align:center;
    padding: 46px 18px;
  }
  .cover .icon{ font-size:2.4rem; margin-bottom:14px; }
  .cover h3{ margin:0 0 8px; font-size:1.2rem; }
  .cover p{ color:var(--ink-dim); font-size:.86rem; margin:0 0 22px; }

  .notice{
    background: rgba(177,68,63,.12);
    border:1px solid rgba(177,68,63,.4);
    color:#e2a09c;
    padding:10px 14px;
    border-radius:8px;
    font-size:.84rem;
    margin: 10px 0;
  }
  .notice.info{
    background: rgba(63,125,110,.12);
    border-color: rgba(63,125,110,.45);
    color:#8fc9ba;
  }

  table.calc{
    width:100%;
    border-collapse:collapse;
    font-size:.82rem;
    margin-top:10px;
  }
  table.calc th, table.calc td{
    border-bottom:1px solid var(--line);
    padding: 7px 6px;
    text-align:left;
  }
  table.calc th{ color:var(--ink-dim); font-weight:600; font-size:.74rem; }
  .win-row{ background: rgba(215,168,60,.08); }

  .pile-result{
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 14px 8px;
    margin-bottom:14px;
    background:var(--bg-panel-2);
  }
  .pile-result h4{ margin:0 0 4px; font-size:1rem; display:flex; align-items:center; gap:8px;}
  .pile-result .winner-line{ font-size:.88rem; margin: 8px 0 2px; }
  .divider{ height:1px; background:var(--line); margin: 18px 0; border:none;}
  .center{ text-align:center; }
  .flexcol{ display:flex; flex-direction:column; gap:8px; }
  .row-between{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .footer-note{ text-align:center; color:var(--ink-dim); font-size:.72rem; margin-top:26px; }
  .tag-select{ display:flex; gap:8px; flex-wrap:wrap; }
  .helpbox{ font-size:.78rem; color:var(--ink-dim); background:var(--bg-panel-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:12px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ============================= 定数 ============================= */
const COLORS = ["black","silver","gold"];
const COLOR_LABEL = {black:"黒", silver:"銀", gold:"金"};
const COLOR_LABEL_LONG = {black:"黒の山", silver:"銀の山", gold:"金の山"};
const COLOR_MOD_MAP = {0:"gold", 1:"silver", 2:"black"}; // sum mod 3 -> double color

/* ============================= 状態 ============================= */
let S = null;

function freshState(){
  return {
    stage: "SETUP",            // SETUP | GAME | RESULT
    difficulty: "normal",
    names: {1:"プレイヤー1", 2:"プレイヤー2"},
    firstPlayer: 1,
    scores: {1:0, 2:0},
    jokersLeft: {1:2, 2:2},
    round: 0,
    phase: null,
    pendingPlayer: null,
    revealed: false,

    piles: {black:[], silver:[], gold:[]},
    doubleColor: null,
    doubleDrawCards: {black:null, silver:null, gold:null},
    fieldCards: {black:null, silver:null, gold:null},

    hands: {1:[], 2:[]},
    jokerUsed: {1:false, 2:false},
    jokerPeek: {1:null, 2:null},

    exchangeChoice: {1:null, 2:null},
    exchangeResult: null,
    receivedCardId: {1:null, 2:null},
    discarded: {1:null, 2:null},
    drawnCard: {1:null, 2:null},
    drawnColor: {1:null, 2:null},

    tempSelectedCard: null,
    bets: {1:{black:[],silver:[],gold:[]}, 2:{black:[],silver:[],gold:[]}},

    lastResult: null,
    winner: null,
    tieBreakApplied: false
  };
}

function other(p){ return p===1?2:1; }

/* ============================= ユーティリティ ============================= */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function makeColorPile(color){
  const arr = [];
  for(let n=0;n<=11;n++) arr.push({id:color+"-"+n, color, number:n});
  return shuffle(arr);
}
function findCard(hand, id){ return hand.find(c=>c.id===id); }
function handColorCounts(hand){
  const counts = {black:0, silver:0, gold:0};
  hand.forEach(c=>{ counts[c.color] += 1; });
  return counts;
}
function colorCountsLabel(counts){
  return COLORS.map(c=> COLOR_LABEL[c]+counts[c]).join(" ");
}
function betColorCounts(player, pile){
  const counts = {black:0, silver:0, gold:0};
  S.bets[player][pile].forEach(id=>{
    const card = findCard(S.hands[player], id);
    if(card) counts[card.color] += 1;
  });
  return counts;
}
function removeCard(hand, id){
  const idx = hand.findIndex(c=>c.id===id);
  if(idx>=0) return hand.splice(idx,1)[0];
  return null;
}
function cardEl(card, opts){
  opts = opts||{};
  const size = opts.small ? " small" : "";
  const clickable = opts.onClick ? " clickable" : "";
  const picked = opts.picked ? " picked" : "";
  const six = (card.number===6 && S.difficulty==="hard") ? " six-badge" : "";
  const div = document.createElement("div");
  div.className = "card color-"+card.color+size+clickable+picked+six;
  div.innerHTML = '<div class="num">'+card.number+'</div><div class="lbl">'+COLOR_LABEL[card.color]+'</div>';
  if(opts.onClick) div.addEventListener("click", opts.onClick);
  return div;
}
function faceDownEl(small){
  const div = document.createElement("div");
  div.className = "card face-down"+(small?" small":"");
  div.innerHTML = '<div class="num">?</div>';
  return div;
}

/* ============================= レンダリング基盤 ============================= */
const app = document.getElementById("app");

function render(){
  app.innerHTML = "";
  const title = document.createElement("div");
  title.className = "top-title";
  title.innerHTML = '<h1>三山勝負</h1><p>黒・銀・金 — 三つの山を賭ける読み合いカードゲーム</p>';
  app.appendChild(title);

  if(S.stage === "SETUP"){ renderSetup(); return; }
  if(S.stage === "RESULT"){ renderScoreboard(); renderResult(); return; }

  renderScoreboard();

  switch(S.phase){
    case "ROUND_INTRO": renderRoundIntro(); break;
    case "DOUBLE_REVEAL": renderDoubleReveal(); break;
    case "JOKER_DECISION": renderJokerDecision(); break;
    case "JOKER_ANNOUNCE": renderJokerAnnounce(); break;
    case "EXCHANGE_SELECT": renderExchangeSelect(); break;
    case "EXCHANGE_REVEAL": renderExchangeReveal(); break;
    case "DISCARD": renderDiscard(); break;
    case "DRAW_CHOICE": renderDrawChoice(); break;
    case "PLACEMENT": renderPlacement(); break;
    case "PLACEMENT_ANNOUNCE": renderPlacementAnnounce(); break;
    case "FIELD_REVEAL": renderFieldReveal(); break;
    case "SCORING": renderScoring(); break;
    default: break;
  }
}

function renderScoreboard(){
  const sb = document.createElement("div");
  sb.className = "scoreboard";
  const handLine = (p)=>{
    if(!S.hands[p] || S.hands[p].length===0) return "";
    return '<div class="jokers">手札の色: '+colorCountsLabel(handColorCounts(S.hands[p]))+'</div>';
  };
  sb.innerHTML =
    '<div class="who"><div class="name">'+S.names[1]+(S.firstPlayer===1?" (先攻)":"")+'</div><div class="pts">'+S.scores[1]+'</div><div class="jokers">🃏 残り '+S.jokersLeft[1]+'</div>'+handLine(1)+'</div>'+
    '<div class="mid">第 '+S.round+' ラウンド<br>難易度: '+diffLabel(S.difficulty)+'</div>'+
    '<div class="who"><div class="name">'+S.names[2]+(S.firstPlayer===2?" (先攻)":"")+'</div><div class="pts">'+S.scores[2]+'</div><div class="jokers">🃏 残り '+S.jokersLeft[2]+'</div>'+handLine(2)+'</div>';
  app.appendChild(sb);
}

function diffLabel(d){ return d==="easy"?"イージー":d==="hard"?"ハード":"ノーマル"; }

/* 汎用: プライベート画面のカバー */
function renderPrivateCover(player, onReveal, subtitle){
  const panel = document.createElement("div");
  panel.className = "panel cover";
  panel.innerHTML =
    '<div class="icon">🂠</div>'+
    '<h3>'+S.names[player]+' の番です</h3>'+
    '<p>'+(subtitle||'画面を他のプレイヤーに見られないようにしてください。準備ができたらタップして内容を表示します。')+'</p>';
  const btn = document.createElement("button");
  btn.className = "primary";
  btn.textContent = "タップして表示する";
  btn.addEventListener("click", onReveal);
  panel.appendChild(btn);
  app.appendChild(panel);
}

function jokerReminderBox(player){
  const peek = S.jokerPeek[player];
  if(!peek) return null;
  const div = document.createElement("div");
  div.className = "notice info";
  if(peek.mode==="single"){
    div.textContent = "🃏 あなたが確認した場の数字 — "+COLOR_LABEL_LONG[peek.color]+": "+peek.value;
  } else {
    div.textContent = "🃏 あなたが確認した場の数字 — 黒: "+peek.values.black+" / 銀: "+peek.values.silver+" / 金: "+peek.values.gold;
  }
  return div;
}

/* ============================= SETUP ============================= */
function renderSetup(){
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = '<h2 class="section-title">ゲームの準備</h2><p class="lead">2人で1つの端末を回して遊ぶ「回し打ち」形式です。自分の番以外の情報は画面をのぞかないようにしましょう。</p>';

  // 名前
  const label1 = document.createElement("label");
  label1.className = "field-label";
  label1.textContent = "プレイヤー1の名前";
  const input1 = document.createElement("input");
  input1.type = "text"; input1.value = S.names[1]; input1.maxLength = 12;
  const label2 = document.createElement("label");
  label2.className = "field-label";
  label2.textContent = "プレイヤー2の名前";
  const input2 = document.createElement("input");
  input2.type = "text"; input2.value = S.names[2]; input2.maxLength = 12;

  panel.appendChild(label1); panel.appendChild(input1);
  panel.appendChild(label2); panel.appendChild(input2);

  // 難易度
  const diffLabelEl = document.createElement("label");
  diffLabelEl.className = "field-label";
  diffLabelEl.textContent = "難易度";
  panel.appendChild(diffLabelEl);
  const diffGrid = document.createElement("div");
  diffGrid.className = "choice-grid";
  [["easy","イージー"],["normal","ノーマル"],["hard","ハード"]].forEach(([val,label])=>{
    const b = document.createElement("button");
    b.textContent = label;
    b.className = (S.difficulty===val ? "selected":"");
    b.addEventListener("click", ()=>{ S.difficulty = val; render(); });
    diffGrid.appendChild(b);
  });
  panel.appendChild(diffGrid);

  const help = document.createElement("div");
  help.className = "helpbox";
  help.innerHTML =
    "イージー：数字一致のみ ×3。ジョーカーは山1つだけ確認。<br>"+
    "ノーマル：上記＋差6も×3、0の山を取ると2倍、ジョーカーで3山すべて確認。<br>"+
    "ハード：上記すべて＋6は3つの山すべてに同時にかかる特殊効果あり。";
  panel.appendChild(help);

  // 先攻
  const firstLabelEl = document.createElement("label");
  firstLabelEl.className = "field-label";
  firstLabelEl.textContent = "先攻プレイヤー";
  panel.appendChild(firstLabelEl);
  const firstGrid = document.createElement("div");
  firstGrid.className = "choice-grid";
  [1,2].forEach(p=>{
    const b = document.createElement("button");
    b.textContent = S.names[p];
    b.className = (S.firstPlayer===p ? "selected":"");
    b.addEventListener("click", ()=>{ S.firstPlayer = p; render(); });
    firstGrid.appendChild(b);
  });
  panel.appendChild(firstGrid);

  const btnrow = document.createElement("div");
  btnrow.className = "btnrow";
  const startBtn = document.createElement("button");
  startBtn.className = "primary";
  startBtn.textContent = "ゲーム開始";
  startBtn.addEventListener("click", ()=>{
    S.names[1] = input1.value.trim() || "プレイヤー1";
    S.names[2] = input2.value.trim() || "プレイヤー2";
    S.scores = {1:0,2:0};
    S.jokersLeft = {1:2,2:2};
    S.round = 0;
    S.stage = "GAME";
    startRound();
  });
  btnrow.appendChild(startBtn);
  panel.appendChild(btnrow);

  app.appendChild(panel);

  const rules = document.createElement("div");
  rules.className = "panel panel-tight";
  rules.innerHTML = '<h2 class="section-title" style="font-size:1rem;">勝利条件</h2><p class="lead" style="margin:0;">合計得点が先に100点以上に到達したプレイヤーの勝利です。同ラウンドで両者が100点以上に到達し、かつ同点だった場合は、そのラウンドで先手だったプレイヤーの勝利となります。また、2ラウンド目以降の先手はそれまでの合計得点が高い方が務め、同点の場合はランダムで決まります。</p>';
  app.appendChild(rules);
}

/* ============================= ラウンド開始処理 ============================= */
function startRound(){
  S.round += 1;
  S.piles = { black: makeColorPile("black"), silver: makeColorPile("silver"), gold: makeColorPile("gold") };
  S.doubleColor = null;
  S.doubleDrawCards = {black:null,silver:null,gold:null};
  S.fieldCards = {black:null,silver:null,gold:null};
  S.hands = {1:[],2:[]};
  S.jokerUsed = {1:false,2:false};

/* ============================= 得点計算 ============================= */
function computeCardHomeStrength(card, pileColor){
  let mult = 1;
  if(card.color === S.doubleColor) mult *= 2;
  const diff = Math.abs(card.number - S.fieldCards[pileColor].number);
  const isMatch = diff === 0;
  const isSix = (S.difficulty !== "easy") && diff === 6;
  if(isMatch || isSix) mult *= 3;
  return {strength: card.number*mult, mult, isMatch, isSix};
}
function computeCardAwayStrength(card, pileColor){
  // used only for hard-mode "6" broadcast effect: no double-color bonus
  let mult = 1;
  const diff = Math.abs(card.number - S.fieldCards[pileColor].number);
  const isMatch = diff === 0;
  const isSix = diff === 6; // hard always includes diff6 rule
  if(isMatch || isSix) mult *= 3;
  return {strength: card.number*mult, mult, isMatch, isSix};
}

function computeScoring(){
  const detail = {1:{black:[],silver:[],gold:[]}, 2:{black:[],silver:[],gold:[]}};
  const totals = {1:{black:0,silver:0,gold:0}, 2:{black:0,silver:0,gold:0}};

  [1,2].forEach(p=>{
    COLORS.forEach(pile=>{
      S.bets[p][pile].forEach(id=>{
        const card = findCard(S.hands[p], id);
        const home = computeCardHomeStrength(card, pile);
        totals[p][pile] += home.strength;
        detail[p][pile].push({card, pile, home, away:null});
        if(S.difficulty === "hard" && card.number === 6){
          COLORS.filter(x=>x!==pile).forEach(otherPile=>{
            const away = computeCardAwayStrength(card, otherPile);
            totals[p][otherPile] += away.strength;
            detail[p][otherPile].push({card, pile: otherPile, home:null, away, broadcastFrom: pile});
          });
        }
      });
    });
  });

  const results = {};
  COLORS.forEach(pile=>{
    const s1 = totals[1][pile], s2 = totals[2][pile];
    let winner = null;
    if(s1 > s2) winner = 1; else if(s2 > s1) winner = 2; else winner = null;
    let points = 0;
    if(winner){
      points = S.fieldCards[pile].number;
      const doubled1 = (pile === S.doubleColor);
      if(doubled1) points *= 2;
      const zeroBonus = (S.difficulty !== "easy") && S.bets[winner][pile].some(id=>{
        const c = findCard(S.hands[winner], id);
        return c.number === 0;
      });
      if(zeroBonus) points *= 2;
      results[pile] = {winner, points, s1, s2, doubled: doubled1, zeroBonus};
    } else {
      results[pile] = {winner:null, points:0, s1, s2, doubled:(pile===S.doubleColor), zeroBonus:false};
    }
  });

  COLORS.forEach(pile=>{
    if(results[pile].winner) S.scores[results[pile].winner] += results[pile].points;
  });

  S.lastResult = {detail, totals, results};
}

function renderScoring(){
  const r = S.lastResult;
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = '<h2 class="section-title">第 '+S.round+' ラウンド結果</h2>';

  COLORS.forEach(pile=>{
    const box = document.createElement("div");
    box.className = "pile-result";
    const res = r.results[pile];
    let title = COLOR_LABEL_LONG[pile] + '（場：' + S.fieldCards[pile].number + '）';
    if(pile === S.doubleColor) title += ' <span class="badge gold">2倍色</span>';
    box.innerHTML = '<h4>'+title+'</h4>';

    const table = document.createElement("table");
    table.className = "calc";
    table.innerHTML = '<tr><th>プレイヤー</th><th>カード内訳</th><th>合計強さ</th></tr>';
    [1,2].forEach(p=>{
      const tr = document.createElement("tr");
      if(res.winner === p) tr.className = "win-row";
      const nameTd = document.createElement("td");
      nameTd.textContent = S.names[p];
      const cardsTd = document.createElement("td");
      const items = r.detail[p][pile];
      if(items.length===0){ cardsTd.textContent = "（なし）"; }
      items.forEach(it=>{
        const span = document.createElement("span");
        span.className = "badge";
        if(it.home){
          let txt = COLOR_LABEL[it.card.color]+it.card.number+" → "+it.home.strength;
          if(it.home.mult>1) txt += "（×"+it.home.mult+"）";
          span.textContent = txt;
        } else if(it.away){
          let txt = "6の効果("+COLOR_LABEL_LONG[it.broadcastFrom]+"より) → "+it.away.strength;
          if(it.away.mult>1) txt += "（×"+it.away.mult+"）";
          span.textContent = txt;
          span.style.borderColor = "#7a6a2e";
        }
        cardsTd.appendChild(span);
      });
      const totalTd = document.createElement("td");
      totalTd.textContent = String(res[p===1?"s1":"s2"]);
      totalTd.style.fontWeight = "700";
      tr.appendChild(nameTd); tr.appendChild(cardsTd); tr.appendChild(totalTd);
      table.appendChild(tr);
    });
    box.appendChild(table);

    const wline = document.createElement("div");
    wline.className = "winner-line";
    if(res.winner){
      let txt = "🏆 "+S.names[res.winner]+" が獲得： "+S.fieldCards[pile].number;
      if(res.doubled) txt += " ×2（2倍色）";
      if(res.zeroBonus) txt += " ×2（0の効果）";
      txt += " = "+res.points+"点";
      wline.textContent = txt;
    } else {
      wline.textContent = "引き分け（この山の獲得なし）";
    }
    box.appendChild(wline);
    panel.appendChild(box);
  });

  app.appendChild(panel);

  const scorePanel = document.createElement("div");
  scorePanel.className = "panel center";
  scorePanel.innerHTML = '<h2 class="section-title">合計得点</h2>'+
    '<p style="font-size:1.1rem;">'+S.names[1]+'：<b>'+S.scores[1]+'</b>　　'+S.names[2]+'：<b>'+S.scores[2]+'</b></p>';
  app.appendChild(scorePanel);

  const btnrow = document.createElement("div");
  btnrow.className = "btnrow";
  btnrow.style.justifyContent = "center";
  const gameOver = S.scores[1] >= 100 || S.scores[2] >= 100;
  const btn = document.createElement("button");
  btn.className = "primary";
  if(gameOver){
    btn.textContent = "最終結果を見る";
    btn.addEventListener("click", ()=>{
      if(S.scores[1] >= 100 && S.scores[2] >= 100 && S.scores[1] === S.scores[2]){
        // 同点で両者100点以上 → 最終ラウンドの先手の勝ち
        S.winner = S.firstPlayer;
        S.tieBreakApplied = true;
      } else if(S.scores[1] >= 100 && S.scores[2] >= 100){
        S.winner = S.scores[1] > S.scores[2] ? 1 : 2;
        S.tieBreakApplied = false;
      } else {
        S.winner = S.scores[1] >= 100 ? 1 : 2;
        S.tieBreakApplied = false;
      }
      S.stage = "RESULT";
      render();
    });
  } else {
    btn.textContent = "次のラウンドへ";
    btn.addEventListener("click", ()=>{
      // 2ラウンド目以降：それまでの合計得点が高い方が次の先手。同点ならランダム。
      if(S.scores[1] > S.scores[2]) S.firstPlayer = 1;
      else if(S.scores[2] > S.scores[1]) S.firstPlayer = 2;
      else S.firstPlayer = (Math.random() < 0.5) ? 1 : 2;
      startRound();
    });
  }
  btnrow.appendChild(btn);
  app.appendChild(btnrow);
}

/* ============================= 結果画面 ============================= */
function renderResult(){
  const panel = document.createElement("div");
  panel.className = "panel center";
  const headline = S.names[S.winner] + " の勝利！";
  panel.innerHTML = '<h2 class="section-title" style="font-size:1.5rem;">'+headline+'</h2>'+
    '<p style="font-size:1.1rem;margin:10px 0 20px;">最終得点　'+S.names[1]+'：<b>'+S.scores[1]+'</b>　　'+S.names[2]+'：<b>'+S.scores[2]+'</b></p>';
  app.appendChild(panel);

  if(S.tieBreakApplied){
    const note = document.createElement("div");
    note.className = "notice info";
    note.style.maxWidth = "520px";
    note.style.margin = "-10px auto 16px";
    note.textContent = "同点で両者100点以上に到達したため、最終ラウンドで先手だった "+S.names[S.winner]+" の勝利となりました。";
    app.appendChild(note);
  }

  const btnrow = document.createElement("div");
  btnrow.className = "btnrow";
  btnrow.style.justifyContent = "center";
  const btn = document.createElement("button");
  btn.className = "primary";
  btn.textContent = "もう一度遊ぶ";
  btn.addEventListener("click", ()=>{ S = freshState(); render(); });
  btnrow.appendChild(btn);
  app.appendChild(btnrow);

  const foot = document.createElement("div");
  foot.className = "footer-note";
  foot.textContent = "三山勝負 — 2人用ローカル対戦カードゲーム";
  app.appendChild(foot);
}

/* ============================= 起動 ============================= */
S = freshState();
render();

})();
</script>
